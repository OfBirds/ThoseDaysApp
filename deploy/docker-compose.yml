# Parameterized stack template, shared by staging and prod.
# Select an environment by pointing compose at its env file, e.g.:
#   docker compose --env-file .env.staging up -d
#   docker compose --env-file .env.prod    up -d
# Project name, image tag, and host ports come from that env file, so the two
# stacks get fully separate volumes/networks and never collide.

name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Published on the LAN so DBeaver can connect. Distinct host port per stack.
      - "${DB_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Release-notification settings (see docs/notifications.md).
      NOTIFY_ON_DEPLOY: ${NOTIFY_ON_DEPLOY}
      # Period reminders (see docs/period-reminders.md). Off unless "true".
      NOTIFY_REMINDERS: ${NOTIFY_REMINDERS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ACCEPT_ALL_CERTS: ${SMTP_ACCEPT_ALL_CERTS}
      # Signed-JWT auth for the local (break-glass) login. JWT_SIGNING_KEY is REQUIRED in
      # deploy stacks (>=32 chars); blank mints an ephemeral key (logs everyone out on restart).
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS}
      # CrimsonRaven SSO (OIDC). Blank OIDC_AUTHORITY → SSO off, local login only (dual-auth;
      # the local path is the backup). See docs/auth-crimsonraven.md.
      OIDC_AUTHORITY: ${OIDC_AUTHORITY}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      # Login mode: unset/'crimsonraven' → CR only; 'legacy' → the app's email/password form only
      # (manual break-glass for CR maintenance, never both). Flipped per-stack in the .env file.
      AUTH_MODE: ${AUTH_MODE:-crimsonraven}
      # CrimsonRaven app-mailer machine PAT (IAM_USER_MANAGER), used ONLY to send email-verification
      # mail for a held (unverified) sign-in — server-side, never reaches the browser. Blank → disabled.
      # See the CrimsonRaven repo's docs/app-email-verification-resend.md.
      CR_MAILER_PAT: ${CR_MAILER_PAT}
      # Structured logs -> shared Seq (per-stack host env file). Apps are separated
      # by the Serilog `Application` property + a per-app-environment Seq API key.
      SEQ_URL: ${SEQ_URL}
      SEQ_API_KEY: ${SEQ_API_KEY}
      # Traces + metrics -> any OTLP ingest (homelab: Seq). Standard OTEL env vars.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
